<!DOCTYPE html>
<html lang="ru">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка – Bootstrap Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Bootstrap Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Форма заявки</h1>
          </div>
          <div class="card-body">
            <div class="alert alert-info" role="alert">
              Заполните форму. Поля со звёздочкой являются обязательными.
            </div>
            <form>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="order-name" class="form-label">Имя *</label>
                  <input id="order-name" type="text" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-email" class="form-label">E-mail *</label>
                  <input id="order-email" type="email" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-phone" class="form-label">Телефон</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input id="order-phone" type="tel" class="form-control" placeholder="900 000-00-00">
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-product" class="form-label">Товар</label>
                  <select id="order-product" class="form-select">
                    <option selected>Выберите товар</option>
                    <option value="1">Винил</option>
                    <option value="2">Наушники</option>
                    <option value="3">Плееры</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="order-comment" class="form-label">Комментарий</label>
                  <textarea id="order-comment" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">Я согласен на обработку данных *</label>
                  </div>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Отправить заявку</button>
                  <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
